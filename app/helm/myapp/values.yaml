replicaCount: 1

image:
  repository: 123456789012.dkr.ecr.ap-south-1.amazonaws.com/myapp
  tag: "latest-dev"     # overridden per-environment — never used as-is in real deploys
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 250m
    memory: 256Mi

livenessProbe:
  httpGet:
    path: /healthz
    port: 8080
  initialDelaySeconds: 5
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /readyz
    port: 8080
  initialDelaySeconds: 5
  periodSeconds: 10

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

env:
  APP_VERSION: "dev"

nodeSelector: {}
tolerations: []
affinity: {}
