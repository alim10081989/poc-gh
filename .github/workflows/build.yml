name: Build and Test

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/build.yml'
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/build.yml'

permissions:
  id-token: write     # required for AWS OIDC — no stored access keys
  contents: read

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: myapp
  AWS_ACCOUNT_ID: "231392323006"

jobs:
  # ────────────────────────────────────────────────────────────
  # JOB 1: Runs on every PR and every push to main.
  # Gate — nothing downstream happens unless this passes.
  # ────────────────────────────────────────────────────────────
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: app/requirements-dev.txt

      - name: Install dependencies
        working-directory: app
        run: pip install -r requirements-dev.txt

      - name: Run unit tests
        working-directory: app
        run: pytest tests/ -v --cov=. --cov-report=term-missing

  # ────────────────────────────────────────────────────────────
  # JOB 2: Validates that the Docker image builds. Local to the
  # runner only — no registry login, no push.
  # ────────────────────────────────────────────────────────────
  build-image:
    name: Build Image
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        working-directory: app
        run: |
          docker build \
            --build-arg APP_VERSION="${{ github.sha }}" \
            -t myapp:${{ github.sha }} \
            .

  # ────────────────────────────────────────────────────────────
  # JOB 3: Only runs on push to main (post-merge), never on PRs.
  # Builds the image, pushes it to ECR. ECR scans on push.
  # ────────────────────────────────────────────────────────────
  push-image:
    name: Push Image to ECR
    needs: [build-test, build-image]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/github-actions-ecr-push
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        working-directory: app
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          docker build \
            --build-arg APP_VERSION="${{ github.sha }}" \
            -t "$REGISTRY/${{ env.ECR_REPOSITORY }}:${{ github.sha }}" \
            -t "$REGISTRY/${{ env.ECR_REPOSITORY }}:latest" \
            .
          docker push "$REGISTRY/${{ env.ECR_REPOSITORY }}:${{ github.sha }}"
          docker push "$REGISTRY/${{ env.ECR_REPOSITORY }}:latest"
